name: Run E2E Tests

# The browser based e2e tests are not run on push/PR anymore (the popup test was failing on CI).
# They can still be started by hand from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

jobs:
  chrome:
    name: E2E tests for Chrome
    runs-on: ubuntu-latest
    steps:
      - name: Clear Puppeteer cache
        run: rm -rf ~/runner/.cache/puppeteer
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        with:
          path: tests/e2e/caps/*.png
